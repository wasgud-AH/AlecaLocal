<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlecaLocal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">Aleca<span>Local</span></div>
  <nav id="tabs"></nav>
  <div class="tools">
    <input id="search" type="search" placeholder="Search…" autocomplete="off">
    <label class="toggle" title="Load item images from cdn.warframestat.us"><input type="checkbox" id="imgToggle"> Images</label>
    <button id="reloadBtn" title="Re-read AlecaFrame files">Reload</button>
  </div>
</header>
<div id="status"></div>
<main id="view"></main>
<dialog id="detail"><div id="detailBody"></div></dialog>
<dialog id="widgetPicker"><div id="pickBody">
  <div class="dnav"><input id="pickQ" type="search" placeholder="Search items to track…" autocomplete="off" aria-label="Search items to track"><button id="pickClose">Close</button></div>
  <div id="pickList"></div>
</div></dialog>
<script src="app.js"></script>
</body>
</html>
